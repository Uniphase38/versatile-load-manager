name: Build Venus package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build offline Venus archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' src/victron_load_manager/__init__.py)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2
              exit 1
            }
          fi

      - name: Build pure-Python Venus dependencies
        run: python3 tools/build_vendor.py

      - name: Build and verify archive
        shell: bash
        run: |
          set -euo pipefail
          tools/build-venus-release.sh --vendor build/vendor
          cd dist
          sha256sum -c "victron-load-manager-${{ steps.version.outputs.version }}-venus.tar.gz.sha256"

      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: victron-load-manager-${{ steps.version.outputs.version }}-venus
          path: |
            dist/victron-load-manager-${{ steps.version.outputs.version }}-venus.tar.gz
            dist/victron-load-manager-${{ steps.version.outputs.version }}-venus.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: victron-load-manager-${{ needs.build.outputs.version }}-venus
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/victron-load-manager-${{ needs.build.outputs.version }}-venus.tar.gz \
            dist/victron-load-manager-${{ needs.build.outputs.version }}-venus.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "VLM ${{ needs.build.outputs.version }}" \
            --generate-notes
