name: Build Venus package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: PYTHONPATH=src:. python3 -m unittest discover

      - name: Build pure-Python vendor directory
        run: python3 tools/build_vendor.py

      - name: Build Venus archive
        run: tools/build-venus-release.sh --vendor build/vendor

      - name: Verify checksum and package contents
        run: |
          cd dist
          sha256sum -c ./*.sha256
          tar -tzf ./*.tar.gz | grep -q '/vendor/VENDOR-MANIFEST.txt$'
          tar -tzf ./*.tar.gz | grep -q '/install.sh$'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: versatile-load-manager-venus
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' src/versatile_load_manager/__init__.py)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Victron Load Manager ${GITHUB_REF_NAME}"
